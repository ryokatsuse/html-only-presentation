	<meta property="og:description" content="SVGの最初の草案はPGMLの一文をそのまま引き継ぎ、タグ名だけimgからimageに変えている。理由はどこにも書かれていない。">

<font size="6">

	<center>

		<h1><font color="#b8a888">SVGの<code>&lt;image&gt;</code>タグ</font></h1>
		<hr width="20%" size="1">

		<table cellpadding="0" align="center">
			<tr>
				<td align="left">
					<ul>
						<li>SVGはHTMLではなくXMLの別の仕様。HTMLと名前を揃える必要がない</li>
						<li>元になった提案のひとつ<a href="https://www.w3.org/TR/1998/NOTE-PGML-19980410">PGML</a>は<code>&lt;img&gt;</code>だった</li>
						<li><a href="https://www.w3.org/TR/1999/WD-SVG-19990211/images.html">SVGの最初の草案</a>で<code>&lt;image&gt;</code>に変わった。理由は書かれていない</li>
					</ul>
				</td>
			</tr>
		</table>
