	<center>

		<h1><font color="#b8a888">なぜ<code>&lt;image&gt;</code>タグと書けるのか</font></h1>
		<hr width="100%" size="1">

		<table cellpadding="0" align="center">
			<tr>
				<td align="left">
					<ul>
						<li><code>&lt;image&gt;</code>要素は、<a href="https://www.w3.org/MarkUp/HTMLPlus/htmlplus_21.html">HTML+の草案</a>に実在した</li>
						<li>Netscapeは両方を実装している。<a href="https://github.com/zii/netscape/blob/master/lib/libparse/pa_tags.h#L39">（1998年公開のソース</a>に定義が残る）</li>
						<li><a href="https://lists.w3.org/Archives/Public/public-whatwg-archive/2007Mar/0605.html">2007年には全ブラウザ</a>が同じ挙動に</li>
						<li>ただなぜ実装したかは分からん。。</li>
					</ul>
				</td>
			</tr>
