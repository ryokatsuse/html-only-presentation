		<h1><font color="#b8a888">なぜ SVG は image なのか</font></h1>
		<hr width="20%" size="1">

		<p><i><font size="5" color="#8fa8c0"><q>Images are specified using the <strong>&lt;img&gt;</strong> element</q></font></i><br>
		<small><cite><font color="#6c7c8c">— <a href="https://www.w3.org/TR/1998/NOTE-PGML-19980410">PGML（Adobe・IBM・Netscape・Sun）</a></font></cite></small></p>

		<p><i><font size="5" color="#8fa8c0"><q>The <strong>image</strong> Element</q></font></i><br>
		<small><cite><font color="#6c7c8c">— <a href="https://www.w3.org/TR/NOTE-VML">VML（Microsoft・Macromedia・Autodesk）</a></font></cite></small></p>

		<p><small><font color="#8a7f6e">W3C は両陣営を同じ部屋に座らせ、<a href="https://www.w3.org/TR/1999/WD-SVG-19990211/">SVG</a> を作らせました。<br>
		採られたのは <font color="#d0a060">VML 側の image</font> でした。</font></small></p>
