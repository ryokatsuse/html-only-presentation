<main>
  <p>タイトルの「階段話」、誤字だと思いましたか?</p>
  <p>日本語では <strong>階段</strong>(かいだん)と <strong>怪談</strong>(かいだん)は同じ音。</p>
  <blockquote>
    <p>怪談は、一段のぼるごとに一話語られるもの。</p>
    <p>このプレゼンも、一段(1スライド)ごとに一話ずつ語ります。</p>
  </blockquote>
  <p>それでは一つ目の怪談へ——。</p>
</main>
