	<center>

		<p><small><font color="#8a7f6e">幕間</font></small></p>
		<h1><font color="#b8a888">もうひとつの image</font></h1>
		<hr width="20%" size="1">

		<p><code><big>&lt;image&gt;</big></code> が書き換えられない場所が、<br>
		ひとつだけあります。<font color="#cf5050">SVG の中</font>です。</p>

		<table border="1" cellpadding="16">
			<tr>
				<td align="center"><small><font color="#8a7f6e">HTML に直接</font></small><br>
				<image src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='160'%3E%3Cpath%20d='M20%20152%20V70%20a50%2050%200%200%201%20100%200%20V152%20l-25-18%20-25%2018%20-25-18%20-25%2018%20z'%20fill='%23c9c2b8'/%3E%3Ccircle%20cx='52'%20cy='72'%20r='9'%20fill='%230a0a12'/%3E%3Ccircle%20cx='88'%20cy='72'%20r='9'%20fill='%230a0a12'/%3E%3C/svg%3E" alt="幽霊" width="87" height="100"><br>
				<small><font color="#cf5050">img に化けている</font></small></td>
				<td align="center"><small><font color="#8a7f6e">svg の中に</font></small><br>
				<svg width="87" height="100"><image href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='160'%3E%3Cpath%20d='M20%20152%20V70%20a50%2050%200%200%201%20100%200%20V152%20l-25-18%20-25%2018%20-25-18%20-25%2018%20z'%20fill='%23c9c2b8'/%3E%3Ccircle%20cx='52'%20cy='72'%20r='9'%20fill='%230a0a12'/%3E%3Ccircle%20cx='88'%20cy='72'%20r='9'%20fill='%230a0a12'/%3E%3C/svg%3E" width="87" height="100"/></svg><br>
				<small><font color="#d0a060">image のまま</font></small></td>
			</tr>
		</table>

		<p>境目は <code><big>&lt;svg&gt;</big></code> の開始タグ、それだけ。</p>
