		<h1><font color="#b8a888">では、誰が決めたのか</font></h1>
		<hr width="20%" size="1">

		<p><small><font color="#8a7f6e">1996年、同じ質問がW3Cのメーリングリストへ。</font></small></p>

		<p><i><font size="5" color="#8fa8c0"><q>Netscape honors an &lt;IMAGE&gt; tag, like &lt;IMG&gt;. Where did this tag come from?</q></font></i><br>
		<small><cite><font color="#6c7c8c">— <a href="https://lists.w3.org/Archives/Public/www-html/1996Oct/0333.html">www-html, 1996-10-24</a></font></cite></small></p>

		<p><small><font color="#8a7f6e">答えは出ないまま、笑い話として流れました。<br>
		そして2026年、Blink と WebKit のソースに残る一行。</font></small></p>

		<p><code><big><font color="#d0a060">// Apparently we're not supposed to ask.</font></big></code></p>

		<p>理由を知る者はもういないのに、<br>
		<font color="#cf5050">訊くなという注意書きだけ</font>が、いまも動いています。</p>
