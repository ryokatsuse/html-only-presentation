	<center>

		<p><small><font color="#8a7f6e">第二話</font></small></p>
		<h1><font color="#b8a888">消える最初の改行</font></h1>
		<hr width="20%" size="1">

		<p><code><big>&lt;pre&gt;</big></code> と <code><big>&lt;textarea&gt;</big></code> の開始タグの直後。<br>
		そこに書いた改行<strong>1文字だけ</strong>が、<font color="#cf5050">警告もなく捨てられます。</font></p>

		<p><i><font size="5" color="#8fa8c0"><q>If the next token is a "newline" character token, then <strong>ignore that token</strong></q></font></i><br>
		<small><cite><font color="#6c7c8c">— HTML Standard, 13.2.6.4.7</font></cite></small></p>

		<table border="1" cellpadding="16">
			<tr>
				<td valign="top"><!-- 中身は演目そのものなので字下げしていません -->
<pre>
改行を1つ書いた → 空行なし</pre>
				</td>
				<td valign="top">
<pre>

改行を2つ書いた → 空行1つ</pre>
				</td>
			</tr>
		</table>

		<p><small><font color="#857c6a">どちらも開始タグの直後に改行を書いています。<br>
		1つ書いた側は空行が出ません。<font color="#d0a060">最初の1文字が消えている</font>からです。</font></small></p>
