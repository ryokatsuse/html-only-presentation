<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>書き換えているのは誰か — なぜ &lt;img&gt;なのか</title>
	<meta name="description" content="同じ &lt;image&gt;でも、HTMLパーサ・createElement・XHTML・SVGで結果が変わる。書き換えているのはHTMLパーサだけ。">
	<meta property="og:title" content="なぜimgなのか — 書き換えているのは誰か">
	<meta property="og:description" content="同じ7文字が、通り道によって画像が表示されたり、されなかったりする。">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="なぜ &lt;img&gt;なのか">
	<meta property="og:locale" content="ja_JP">
	<meta property="og:url" content="https://html-only-presentation.vercel.app/03.html">
	<meta property="og:image" content="https://html-only-presentation.vercel.app/ogp.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
</head>
<body bgcolor="#0a0a12" text="#c9c2b8" link="#9fb8d0" vlink="#8a7f9e" alink="#c9c2b8">
<font size="6">

	<center>

		<h1><font color="#b8a888">どこで書き換えられているの</font></h1>

		<table border="1" cellpadding="12">
			<tr>
				<td><font size="4">方法</font></td>
				<td><font size="4">ブラウザでの表示</font></td>
				<td><font size="4">DOMでは何になるか</font></td>
			</tr>

			<tr>
				<td><font size="4">HTMLで書く<br>
				<code>&lt;image src=…&gt;</code></font></td>
				<td align="center">
					<image src="images/infixer.jpg" alt="infixer のアイコン" width="80" height="80"><br>
					<small><font color="#d0a060">画像が表示される</font></small>
				</td>
				<td><font size="4" color="#d0a060">HTMLImageElement</font></td>
			</tr>

			<tr>
				<td><font size="4"><code>JavaScriptから挿入</font></td>
				<td align="center">
					<span id="js-demo"></span>
					<script>
						const imageElement = document.createElement('image');
						imageElement.setAttribute('src', 'images/infixer.jpg');
						imageElement.setAttribute('width', '80');
						imageElement.setAttribute('height', '80');
						document.getElementById('js-demo').appendChild(imageElement);
					</script>
					<br>
					<small>画像が表示されない</small>
				</td>
				<td><font size="4">HTMLUnknownElement</font></td>
			</tr>
		</table>

		<p>書き換えているのは、HTMLパーサー</p>
		<p>
			<a href="02.html" accesskey="p">&lt; 前へ</a> ／
			<a href="04.html" accesskey="n" autofocus>次へ &gt;</a>
		</p>

	</center>

</font>
</body>
</html>
