		<p><small><font color="#8a7f6e">第三話</font></small></p>
		<h1><font color="#b8a888">存在しないタグ</font></h1>
		<hr width="20%" size="1">

		<p><code><big>&lt;image&gt;</big></code> という要素は、HTMLに<strong>存在しません</strong>。<br>
		それでも書くと、<font color="#cf5050">画像が出ます。</font></p>

		<p><image src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='160'%3E%3Cpath%20d='M20%20152%20V70%20a50%2050%200%200%201%20100%200%20V152%20l-25-18%20-25%2018%20-25-18%20-25%2018%20z'%20fill='%23c9c2b8'/%3E%3Ccircle%20cx='52'%20cy='72'%20r='9'%20fill='%230a0a12'/%3E%3Ccircle%20cx='88'%20cy='72'%20r='9'%20fill='%230a0a12'/%3E%3C/svg%3E" alt="幽霊" width="96" height="110"></p>

		<p><small><font color="#857c6a">ソースは <code><big>&lt;image&nbsp;src=…&gt;</big></code>。DevTools に立っているのは <code><big>&lt;img&gt;</big></code>。<br>
		パーサが書き換えているからです。その手順が、仕様にあります。</font></small></p>

		<p><i><font size="5" color="#8fa8c0"><q>Change the token's tag name to "img" and reprocess it. <strong>(Don't ask.)</strong></q></font></i><br>
		<small><cite><font color="#6c7c8c">— <a href="https://html.spec.whatwg.org/multipage/parsing.html#parsing-main-inbody">HTML Standard, 13.2.6.4.7</a></font></cite></small></p>

		<p>Don't ask. <font color="#cf5050">訊くな</font>、と書いてあります。</p>
